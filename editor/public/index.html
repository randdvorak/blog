<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Local Blog Editor</title>
    <link rel="stylesheet" href="/editor.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div>
            <span class="kicker">Local workspace</span>
            <h1>Blog editor</h1>
          </div>
          <button class="icon-button" id="new-post" type="button" aria-label="Create a new post">+</button>
        </div>
        <label class="search-label">
          <span class="sr-only">Search posts</span>
          <input id="search" type="search" placeholder="Search posts" />
        </label>
        <div class="post-list" id="post-list" aria-live="polite"></div>
        <div class="sidebar-footer">
          <span class="local-dot" aria-hidden="true"></span>
          Stored on this computer
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <span class="save-state" id="save-state">No unsaved changes</span>
          </div>
          <div class="top-actions">
            <button class="button danger" id="delete-post" type="button">Delete</button>
            <a class="button secondary" href="http://127.0.0.1:4321/blog/" target="_blank" rel="noopener">View site</a>
            <button class="button primary" id="save-post" type="button">Save post</button>
          </div>
        </header>

        <div class="editor-grid">
          <section class="editor-pane" aria-label="Post editor">
            <div class="fields">
              <input class="title-input" id="title" type="text" placeholder="Post title" aria-label="Post title" />
              <div class="meta-grid">
                <label>Slug<input id="slug" type="text" placeholder="post-slug" /></label>
                <label>Date<input id="date" type="date" /></label>
                <label class="wide">Description<input id="description" type="text" placeholder="A short summary for lists and search results" /></label>
                <label class="wide">Tags<input id="tags" type="text" placeholder="notes, technology" /></label>
                <label class="draft-toggle"><input id="draft" type="checkbox" checked /> Keep this post as a draft</label>
              </div>
            </div>

            <div class="toolbar" role="toolbar" aria-label="Formatting tools">
              <button type="button" data-format="heading" title="Heading">H2</button>
              <button type="button" data-format="bold" title="Bold"><strong>B</strong></button>
              <button type="button" data-format="italic" title="Italic"><em>I</em></button>
              <button type="button" data-format="link" title="Link">Link</button>
              <button type="button" data-format="quote" title="Quote">Quote</button>
              <button type="button" data-format="list" title="Bulleted list">List</button>
              <button type="button" data-format="code" title="Code">Code</button>
              <button type="button" id="add-image" title="Add image">Image</button>
              <input id="image-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif" hidden />
            </div>
            <textarea id="body" spellcheck="true" placeholder="Start writing…" aria-label="Post content"></textarea>
          </section>

          <section class="preview-pane" aria-label="Post preview">
            <div class="preview-label">Preview</div>
            <article class="prose" id="preview"></article>
          </section>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/editor.js"></script>
  </body>
</html>
